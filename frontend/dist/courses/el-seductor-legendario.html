<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Seductor Legendario</title>
    <style>
      :root {
        --bg: #0e0c0a;
        --panel: #15110d;
        --text: #f5f0e8;
        --muted: rgba(245, 240, 232, 0.68);
        --gold: #d4a857;
        --border: rgba(245, 240, 232, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at top right, #261a0f 0%, var(--bg) 44%);
        color: var(--text);
      }

      .wrap {
        width: min(1100px, 100% - 32px);
        margin: 30px auto 56px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3.5vw, 2.6rem);
        letter-spacing: 0.03em;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .grid {
        margin-top: 24px;
        display: grid;
        gap: 20px;
      }

      .video-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        padding: 16px;
      }

      .video-card h2 {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: 0.95rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .embed-16x9 {
        padding: 56.25% 0 0 0;
        position: relative;
      }

      .embed-9x16 {
        padding: 177.78% 0 0 0;
        position: relative;
        max-width: 420px;
      }

      .embed iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
      }
    </style>
  </head>
